<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyRA · Clientes</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand.css"><style>body{background:#f3f7f8}.app{max-width:1050px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#123f61,#087f92);color:#fff;border-radius:18px;padding:22px}.hero img{width:55px;background:#fff;border-radius:50%;padding:4px;float:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #d1dfe3;border-radius:14px;padding:16px}.field{margin:9px 0}.field label{display:block;font-weight:800;color:#123f61;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #aebfc5;border-radius:9px}.btn{border:0;border-radius:9px;padding:12px 15px;background:#087f92;color:#fff;font-weight:800;cursor:pointer}.item{border-top:1px solid #dbe5e7;padding:12px 0}.tag{display:inline-block;background:#e5f2f1;padding:5px 9px;border-radius:14px;font-size:12px;font-weight:800;margin:3px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="hero"><img src="logosolo.png"><b>SyRA · CLIENTES</b><h1>Ficha maestra del cliente</h1><p>Una ficha única para vincular establecimientos, servicios, órdenes, visitas e historial.</p></section><div class="grid"><section class="card"><h2>Nuevo cliente</h2><div class="field"><label>Razón social / nombre *</label><input id="nombre"></div><div class="field"><label>CUIT</label><input id="cuit"></div><div class="field"><label>Actividad</label><input id="actividad"></div><div class="field"><label>Responsable / contacto</label><input id="contacto"></div><div class="field"><label>Teléfono / WhatsApp</label><input id="telefono"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Observaciones</label><textarea id="obs"></textarea></div><button class="btn" onclick="guardar()">GUARDAR CLIENTE</button></section><section class="card"><h2>Clientes registrados</h2><div id="lista"></div></section></div></main><script>function guardar(){if(!nombre.value.trim())return alert('Ingresá el nombre o razón social.');const a=JSON.parse(localStorage.getItem('syra_clientes')||'[]');a.push({id:'CLI-'+Date.now(),nombre:nombre.value.trim(),cuit:cuit.value,actividad:actividad.value,contacto:contacto.value,telefono:telefono.value,email:email.value,obs:obs.value,creado:new Date().toISOString()});localStorage.setItem('syra_clientes',JSON.stringify(a));['nombre','cuit','actividad','contacto','telefono','email','obs'].forEach(x=>document.getElementById(x).value='');render()}function render(){const a=JSON.parse(localStorage.getItem('syra_clientes')||'[]').slice().reverse();lista.innerHTML=a.length?a.map(x=>`<div class="item"><b>${x.id} · ${x.nombre}</b><br><span class="tag">${x.actividad||'Actividad no cargada'}</span><span class="tag">${x.contacto||'Sin responsable'}</span><br>${x.telefono||''} ${x.email||''}</div>`).join(''):'Todavía no hay clientes.'}render();</script></body></html>
