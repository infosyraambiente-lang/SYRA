<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidencia sanitaria | SyRA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand.css"><style>.wrapx{max-width:1100px;margin:auto;padding:34px 20px}.lang,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.lang{justify-content:flex-end}.lang button,.tabs button{padding:9px 13px;border:1px solid #087f92;background:#fff;border-radius:22px;font-weight:700;cursor:pointer}.lang .on,.tabs .on{background:#087f92;color:#fff}.hero2{background:#eef8f6;border-radius:18px;padding:27px}.panel{background:#fff;border:1px solid #cbd8de;border-radius:15px;padding:22px;margin-top:14px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.kpi{border:1px solid #d3e0e4;border-radius:12px;padding:16px}.kpi b{display:block;font-size:27px;color:#174e69}.simpletable{width:100%;border-collapse:collapse;margin:18px 0}.simpletable th,.simpletable td{padding:12px;border-bottom:1px solid #d7e1e4;text-align:left;vertical-align:top}.simpletable th{background:#eef8f6}.riskbar{margin:12px 0}.bar{height:22px;background:#e4ecef;border-radius:12px;overflow:hidden}.fill{height:100%;background:#087f92}.source{font-size:12px;border-left:4px solid #087f92;padding-left:10px;margin:10px 0}.note{background:#fff4df;border-left:5px solid #d39200;padding:15px;border-radius:9px}.links a{display:block;margin:8px 0}.logoMark{display:flex;align-items:center;gap:8px;font-size:12px;color:#526a75}.logoMark img{width:34px}@media(max-width:700px){.kpis{grid-template-columns:1fr}.simpletable{font-size:13px}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="logo-syra.png" alt="SyRA"><span><b>SyRA</b><small>Saneamiento y Restauración Ambiental</small></span></a></div></header><main class="wrapx"><a href="index.html">← <span id="back">Volver a SyRA</span></a><div class="lang"><button class="on" onclick="setLang('es',this)">ES Español</button><button onclick="setLang('en',this)">EN English</button><button onclick="setLang('pt',this)">PT Português</button><button onclick="setLang('zh',this)">中文</button></div><section class="hero2"><p class="over" id="eye"></p><h1 id="title"></h1><p class="lead" id="intro"></p></section><div class="tabs"><button class="on" onclick="tab='cockroach';draw(this)">🪳 <span id="tc">Cucarachas</span></button><button onclick="tab='flies';draw(this)">🪰 <span id="tf">Moscas</span></button><button onclick="tab='bedbugs';draw(this)">🛏️ <span id="tb">Chinches</span></button><button onclick="tab='rodents';draw(this)">🐭 <span id="tr">Roedores</span></button></div><div id="panel"></div></main><footer><div class="wrap"><span>© SyRA</span><span>Comodoro Rivadavia · Patagonia</span></div></footer><script>let L='es',tab='cockroach';const ui={es:['Volver a SyRA','Evidencia científica de fácil lectura','Plagas, exposición y salud','Tablas y gráficos propios de SyRA construidos únicamente a partir de fuentes sanitarias y publicaciones científicas identificadas.','Cucarachas','Moscas','Chinches','Roedores'],en:['Back to SyRA','Scientific evidence made easy','Pests, exposure and health','SyRA tables and charts based only on identified health authorities and scientific publications.','Cockroaches','Flies','Bed bugs','Rodents'],pt:['Voltar à SyRA','Evidência científica de fácil leitura','Pragas, exposição e saúde','Tabelas e gráficos SyRA baseados apenas em autoridades sanitárias e publicações científicas identificadas.','Baratas','Moscas','Percevejos','Roedores'],zh:['返回 SyRA','简单易懂的科学证据','虫害、暴露与健康','SyRA 的表格和图示仅依据已明确标注的卫生机构资料和科学研究制作。','蟑螂','苍蝇','臭虫','鼠类']};const data={es:{cockroach:{h:'Cucarachas y salud',lead:'La evidencia sanitaria es especialmente sólida para alérgenos y asma. En ámbitos sanitarios también se han aislado numerosos microorganismos de cucarachas; aislar un microorganismo no demuestra por sí solo transmisión de enfermedad.',k:[['36,8%','Niños asmáticos de un estudio urbano que presentaron alergia a alérgeno de cucaracha.'],['50,2%','Dormitorios del estudio con niveles altos de alérgeno de cucaracha.'],['2,56','Consultas médicas no programadas/año en niños alérgicos y altamente expuestos, frente a 1,43 en los demás.']],rows:[['Heces y saliva','Contienen proteínas capaces de causar alergia o desencadenar síntomas de asma.','EPA'],['Partes corporales','También pueden actuar como desencadenantes de asma.','EPA'],['Entornos sanitarios','CDC lista bacterias y otros microorganismos aislados de cucarachas en establecimientos de salud.','CDC']],chart:'Consultas médicas no programadas por asma/año',bars:[['Alta exposición + alergia',2.56],['Otros niños del estudio',1.43]],src:'Estudio NEJM de 476 niños con asma (1997); EPA; CDC Infection Control.'},flies:{h:'Moscas y salud',lead:'Las moscas pueden actuar como vectores mecánicos: contactan residuos, materia fecal o ambientes contaminados y pueden trasladar microorganismos hacia otras superficies o alimentos.',k:[['5','Grupos bacterianos destacados en una revisión 2025: Salmonella, E. coli, Listeria, Klebsiella y Campylobacter.'],['2025','Revisión científica reciente en Journal of Food Protection.'],['Mecánica','Una vía clave descrita es el transporte físico de microorganismos.']],rows:[['Contacto','Materia orgánica, residuos y ambientes contaminados.','J Food Protection'],['Transferencia','Patas, cuerpo y otros mecanismos pueden contribuir al traslado.','Revisión 2025'],['Destino','Alimentos, animales y superficies pueden entrar en la cadena de exposición.','Revisión 2025']],chart:'Esquema de riesgo — no representa porcentajes',bars:[['Contacto con contaminación',3],['Transporte mecánico',3],['Contacto con alimento/superficie',3]],src:'Shahanaz et al., Journal of Food Protection, 2025.'},bedbugs:{h:'Chinches de cama y salud',lead:'Acá es importante no exagerar: CDC indica que las chinches no son conocidas por transmitir enfermedades a las personas. Su importancia sanitaria se relaciona principalmente con picaduras y sus consecuencias.',k:[['NO','CDC no las considera vectores eficaces de enfermedad.'],['Picaduras','Pueden producir picazón e inflamación.'],['Secundaria','El rascado intenso puede favorecer infección cutánea secundaria.']],rows:[['Piel','Picaduras, prurito e inflamación.','CDC'],['Sueño','CDC menciona pérdida de sueño/insomnio.','CDC'],['Reacciones','Pueden ocurrir reacciones alérgicas; las graves son raras.','CDC']],chart:'Lectura sanitaria cualitativa',bars:[['Transmisión demostrada de enfermedad',0],['Importancia dermatológica',3],['Impacto sobre sueño/bienestar',2]],src:'CDC Bed Bugs: About / Clinical Care / DPDx, 2024.'},rodents:{h:'Roedores y salud',lead:'Los roedores requieren prevención porque determinadas infecciones pueden relacionarse con exposición a orina, heces o saliva de animales infectados.',k:[['Heces','Una de las matrices de exposición descritas por CDC para hantavirus.'],['Orina','También forma parte de las vías de exposición relevantes.'],['Saliva','CDC la incluye entre los materiales potencialmente infecciosos.']],rows:[['Ambiente','La contaminación puede quedar en áreas donde hubo actividad de roedores.','CDC'],['Limpieza','CDC recomienda procedimientos específicos de limpieza segura.','CDC'],['Prevención','Evitar contacto y controlar infestaciones reduce oportunidades de exposición.','CDC']],chart:'Cadena simple de exposición',bars:[['Roedor / excretas',3],['Ambiente contaminado',3],['Exposición humana',3]],src:'CDC Hantavirus Prevention y Rodent Clean-up.'}}};const generic={en:{cockroach:['Cockroaches and health','Evidence is particularly strong for allergens and asthma. Microorganisms have also been isolated from cockroaches in healthcare settings; isolation alone does not prove disease transmission.'],flies:['Flies and health','Flies can act as mechanical vectors, moving microorganisms after contact with waste, fecal matter or contaminated environments.'],bedbugs:['Bed bugs and health','CDC states that bed bugs are not known to spread disease. Their main health importance is related to bites, itching, sleep loss and possible secondary skin infection.'],rodents:['Rodents and health','Some infections can be associated with exposure to urine, feces or saliva from infected rodents.']},pt:{cockroach:['Baratas e saúde','A evidência é especialmente forte para alérgenos e asma. Microrganismos também foram isolados de baratas em ambientes de saúde; o isolamento não prova transmissão.'],flies:['Moscas e saúde','Moscas podem atuar como vetores mecânicos, transportando microrganismos após contato com resíduos, fezes ou ambientes contaminados.'],bedbugs:['Percevejos e saúde','O CDC afirma que percevejos não são conhecidos por transmitir doenças. A principal importância sanitária envolve picadas, coceira, perda de sono e possível infecção secundária.'],rodents:['Roedores e saúde','Algumas infecções podem estar relacionadas à exposição à urina, fezes ou saliva de roedores infectados.']},zh:{cockroach:['蟑螂与健康','关于蟑螂过敏原和哮喘的证据较为充分。医疗环境中的蟑螂也曾分离出多种微生物，但检出微生物本身并不能证明疾病传播。'],flies:['苍蝇与健康','苍蝇可作为机械传播媒介，在接触垃圾、粪便或受污染环境后将微生物带到其他表面或食品。'],bedbugs:['臭虫与健康','CDC 指出，目前并不知道臭虫会向人传播疾病。其主要健康影响与叮咬、瘙痒、睡眠受影响以及可能的继发皮肤感染有关。'],rodents:['鼠类与健康','某些感染可能与接触受感染鼠类的尿液、粪便或唾液有关。']}};const links={'EPA cockroach':'https://www.epa.gov/asthma/asthma-triggers-gain-control','CDC cockroach':'https://www.cdc.gov/infection-control/hcp/environmental-control/appendix-d-insects-and-microorganisms.html','NEJM/PubMed':'https://pubmed.ncbi.nlm.nih.gov/9134876/','Flies/PubMed':'https://pubmed.ncbi.nlm.nih.gov/40348086/','CDC bed bugs':'https://www.cdc.gov/bed-bugs/about/','CDC clinical':'https://www.cdc.gov/bed-bugs/hcp/clinical-care/index.html','CDC hantavirus':'https://www.cdc.gov/hantavirus/prevention/index.html','CDC rodent clean-up':'https://www.cdc.gov/healthy-pets/rodent-control/clean-up.html'};function setLang(l,b){L=l;document.documentElement.lang=l;document.querySelectorAll('.lang button').forEach(x=>x.classList.remove('on'));b.classList.add('on');let a=ui[l];['back','eye','title','intro','tc','tf','tb','tr'].forEach((id,i)=>document.getElementById(id).textContent=a[i]);draw()}function draw(b){if(b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}let d=data.es[tab],h=d.h,lead=d.lead;if(L!='es'){h=generic[L][tab][0];lead=generic[L][tab][1]}let rows=d.rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');let max=Math.max(...d.bars.map(x=>x[1]),3);let bars=d.bars.map(x=>`<div class="riskbar"><b>${x[0]}</b><div class="bar"><div class="fill" style="width:${x[1]?Math.max(8,x[1]/max*100):2}%"></div></div>${typeof x[1]=='number'&&tab=='cockroach'?'<small>'+x[1]+'</small>':''}</div>`).join('');let lk=tab=='cockroach'?['EPA cockroach','CDC cockroach','NEJM/PubMed']:tab=='flies'?['Flies/PubMed']:tab=='bedbugs'?['CDC bed bugs','CDC clinical']:['CDC hantavirus','CDC rodent clean-up'];document.getElementById('panel').innerHTML=`<section class="panel"><div class="logoMark"><img src="logo-syra.png" alt="SyRA">Visualización SyRA · fuentes externas identificadas</div><h2>${h}</h2><p class="lead small">${lead}</p><div class="kpis">${d.k.map(x=>`<div class="kpi"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div><table class="simpletable"><thead><tr><th>Factor</th><th>Evidencia / significado</th><th>Fuente</th></tr></thead><tbody>${rows}</tbody></table><h3>${d.chart}</h3>${bars}<p class="source"><b>Fuente de los datos:</b> ${d.src}</p><p class="note">Los gráficos SyRA simplifican visualmente la evidencia citada. No convierten datos cualitativos en probabilidades ni implican que la presencia de una plaga produzca necesariamente enfermedad.</p><div class="links"><b>Documentos originales:</b>${lk.map(k=>`<a href="${links[k]}" target="_blank" rel="noopener">${k}</a>`).join('')}</div></section>`}setLang('es',document.querySelector('.lang button'));</script></body></html>
