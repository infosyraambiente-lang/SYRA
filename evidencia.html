<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidencia sanitaria | SyRA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand.css"><style>.wrapx{max-width:1100px;margin:auto;padding:38px 20px}.lang{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:18px}.lang button{padding:8px 12px;border:1px solid #087f92;background:#fff;border-radius:20px;font-weight:700;cursor:pointer}.lang .on{background:#087f92;color:#fff}.hero2{background:#eef8f6;border-radius:18px;padding:28px}.cards2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:24px 0}.e{background:#fff;border:1px solid #cbd8de;border-radius:14px;padding:20px}.source{font-size:12px;border-left:4px solid #087f92;padding-left:10px;margin-top:12px}.big{font-size:34px;font-weight:800;color:#174e69}.flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:20px;background:#fff;border-radius:14px;margin:20px 0}.flow span{padding:12px;border-radius:9px;background:#eaf5f1;font-weight:700}.flow .arrow{background:none}.warn{background:#fff4df;border-left:5px solid #d39200;padding:18px;border-radius:10px}.links a{display:block;margin:9px 0}@media(max-width:700px){.cards2{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img src="logo-syra.png" alt="SyRA"><span><b>SyRA</b><small>Saneamiento y Restauración Ambiental</small></span></a></div></header><main class="wrapx"><a href="index.html">← <span id="back">Volver a SyRA</span></a><div class="lang"><button class="on" onclick="setL('es',this)">ES Español</button><button onclick="setL('en',this)">EN English</button><button onclick="setL('pt',this)">PT Português</button><button onclick="setL('zh',this)">中文</button></div><div id="content"></div></main><footer><div class="wrap"><span>© SyRA</span><span>Comodoro Rivadavia · Patagonia</span></div></footer><script>const X={es:{back:'Volver a SyRA',eye:'Evidencia y prevención',title:'Por qué la gestión de plagas también es gestión de salud',intro:'Información resumida a partir de organismos sanitarios y técnicos reconocidos. La fuente original permanece visible junto a cada afirmación.',flowtitle:'De la plaga a la exposición',f1:'Roedor / plaga',f2:'Orina · heces · saliva · superficies',f3:'Ambiente / alimento / manos',f4:'Exposición humana',d1:'Enfermedades asociadas a alimentos no seguros',p1:'La OMS informa que los alimentos contaminados con bacterias, virus, parásitos o sustancias químicas nocivas pueden causar más de 200 enfermedades diferentes.',d2:'Roedores: heces, orina y saliva importan',p2:'La OMS señala que los roedores pueden portar enfermedades y contaminar alimentos mediante orina, heces o saliva. CDC también describe exposición a hantavirus por contacto con excretas o saliva de roedores infectados.',d3:'Los insectos pueden transferir contaminación',p3:'Material de la OMS describe a las moscas como vectores mecánicos capaces de trasladar contaminación desde superficies hacia alimentos.',d4:'El control de plagas es prevención',p4:'FAO incluye el control de plagas dentro de las buenas prácticas destinadas a controlar peligros y prevenir contaminación.',take:'¿Puede trasladarse contaminación del trabajo al hogar?',takep:'Existe el concepto técnico de “take-home exposure” o exposición secundaria/paraocupacional. NIOSH/CDC documenta que ciertos contaminantes laborales pueden trasladarse mediante piel, cabello, ropa, calzado, herramientas u objetos y exponer a integrantes del hogar.',prec:'Importante: esto no significa que cualquier patógeno de una plaga necesariamente será llevado al hogar o causará enfermedad. Depende del agente, la vía de transmisión y las circunstancias.',docs:'Consultar documentos originales',docp:'Los enlaces conducen a las fuentes institucionales. SyRA resume la información, pero no presenta esos resultados como investigación propia.',src:'Fuente'},en:{back:'Back to SyRA',eye:'Evidence and prevention',title:'Why pest management is also health-risk management',intro:'Information summarized from recognized health and technical organizations. The original source remains visible beside each statement.',flowtitle:'From pest to exposure',f1:'Rodent / pest',f2:'Urine · feces · saliva · surfaces',f3:'Environment / food / hands',f4:'Human exposure',d1:'Diseases associated with unsafe food',p1:'WHO reports that food contaminated with harmful bacteria, viruses, parasites or chemicals can cause more than 200 different diseases.',d2:'Rodents: feces, urine and saliva matter',p2:'WHO notes that rodents can carry disease and contaminate food through urine, feces or saliva. CDC also describes hantavirus exposure involving infected rodent excreta or saliva.',d3:'Insects can transfer contamination',p3:'WHO material describes flies as mechanical vectors capable of transferring contamination from surfaces to food.',d4:'Pest control is prevention',p4:'FAO includes pest control among good hygiene practices used to control hazards and prevent contamination.',take:'Can workplace contamination be carried home?',takep:'A technical concept called “take-home exposure” or secondary/para-occupational exposure exists. NIOSH/CDC documents that some workplace contaminants can be carried on skin, hair, clothing, shoes, tools or objects and expose household members.',prec:'Important: this does not mean that every pathogen associated with a pest will necessarily be carried home or cause disease. Risk depends on the agent, route of transmission and circumstances.',docs:'View original documents',docp:'Links lead to the institutional sources. SyRA summarizes the information and does not present these findings as its own research.',src:'Source'},pt:{back:'Voltar à SyRA',eye:'Evidência e prevenção',title:'Por que o manejo de pragas também é gestão de riscos à saúde',intro:'Informação resumida a partir de organizações sanitárias e técnicas reconhecidas. A fonte original permanece visível junto a cada afirmação.',flowtitle:'Da praga à exposição',f1:'Roedor / praga',f2:'Urina · fezes · saliva · superfícies',f3:'Ambiente / alimento / mãos',f4:'Exposição humana',d1:'Doenças associadas a alimentos não seguros',p1:'A OMS informa que alimentos contaminados por bactérias, vírus, parasitas ou substâncias químicas nocivas podem causar mais de 200 doenças diferentes.',d2:'Roedores: fezes, urina e saliva importam',p2:'A OMS indica que roedores podem portar doenças e contaminar alimentos por urina, fezes ou saliva. O CDC também descreve exposição ao hantavírus envolvendo excretas ou saliva de roedores infectados.',d3:'Insetos podem transferir contaminação',p3:'Material da OMS descreve moscas como vetores mecânicos capazes de transferir contaminação de superfícies para alimentos.',d4:'Controle de pragas é prevenção',p4:'A FAO inclui o controle de pragas entre as boas práticas destinadas a controlar perigos e prevenir contaminação.',take:'A contaminação do trabalho pode chegar à residência?',takep:'Existe o conceito técnico de “take-home exposure”, exposição secundária ou paraocupacional. NIOSH/CDC documenta que alguns contaminantes ocupacionais podem ser transportados na pele, cabelo, roupas, calçados, ferramentas ou objetos e expor familiares.',prec:'Importante: isso não significa que todo patógeno associado a uma praga será necessariamente levado para casa ou causará doença. O risco depende do agente, da via de transmissão e das circunstâncias.',docs:'Consultar documentos originais',docp:'Os links levam às fontes institucionais. A SyRA resume as informações e não apresenta esses resultados como pesquisa própria.',src:'Fonte'},zh:{back:'返回 SyRA',eye:'科学证据与预防',title:'为什么虫害管理也是健康风险管理',intro:'本页内容依据公认的卫生和技术机构资料进行摘要。每项说明旁均保留原始来源。',flowtitle:'从虫害到人体暴露',f1:'鼠类 / 害虫',f2:'尿液 · 粪便 · 唾液 · 表面',f3:'环境 / 食品 / 手部',f4:'人体暴露',d1:'不安全食品相关疾病',p1:'世界卫生组织指出，被有害细菌、病毒、寄生虫或化学物质污染的食品可导致200多种不同疾病。',d2:'鼠类：粪便、尿液和唾液都很重要',p2:'世界卫生组织指出，鼠类可能携带疾病，并通过尿液、粪便或唾液污染食品。美国疾控中心也说明了与受感染鼠类排泄物或唾液有关的汉坦病毒暴露。',d3:'昆虫可以转移污染物',p3:'世界卫生组织资料将苍蝇描述为机械传播媒介，可将污染从表面带到食品上。',d4:'虫害控制也是预防措施',p4:'联合国粮农组织将虫害控制列入用于控制危害和预防污染的良好卫生规范。',take:'工作场所的污染物会被带回家吗？',takep:'存在“带回家暴露”（take-home exposure），也称继发性或旁职业暴露。NIOSH/CDC 资料指出，一些工作场所污染物可能通过皮肤、头发、衣物、鞋、工具或物品被带回家，使家庭成员受到暴露。',prec:'重要说明：这并不意味着与害虫有关的任何病原体都会被带回家或一定导致疾病。风险取决于具体病原体、传播途径和实际情况。',docs:'查看原始资料',docp:'以下链接指向机构原始资料。SyRA 对信息进行摘要，但不会把这些研究结果作为自己的科研成果。',src:'来源'}};const links=[['OMS / WHO · Food Safety','https://www.who.int/news-room/fact-sheets/detail/food-safety'],['CDC · Hantavirus Prevention','https://www.cdc.gov/hantavirus/prevention/index.html'],['CDC · Rodent clean-up','https://www.cdc.gov/healthy-pets/rodent-control/clean-up.html'],['CDC/NIOSH · Take-Home Exposures','https://www.cdc.gov/niosh/reproductive-health/about/take-home.html'],['FAO · Hygiene and Pest Control','https://www.fao.org/good-hygiene-practices-haccp-toolbox/ghp/establishment-maintenance-cleaning-and-disinfection-and-pest-control/']];function render(l){let a=X[l];document.getElementById('back').textContent=a.back;document.getElementById('content').innerHTML=`<section class="hero2"><p class="over">${a.eye}</p><h1>${a.title}</h1><p class="lead">${a.intro}</p></section><h2>${a.flowtitle}</h2><div class="flow"><span>${a.f1}</span><span class="arrow">→</span><span>${a.f2}</span><span class="arrow">→</span><span>${a.f3}</span><span class="arrow">→</span><span>${a.f4}</span></div><div class="cards2"><article class="e"><div class="big">200+</div><h3>${a.d1}</h3><p>${a.p1}</p><p class="source"><b>${a.src}:</b> WHO · Food Safety</p></article><article class="e"><h3>${a.d2}</h3><p>${a.p2}</p><p class="source"><b>${a.src}:</b> WHO · CDC</p></article><article class="e"><h3>${a.d3}</h3><p>${a.p3}</p><p class="source"><b>${a.src}:</b> WHO</p></article><article class="e"><h3>${a.d4}</h3><p>${a.p4}</p><p class="source"><b>${a.src}:</b> FAO</p></article></div><section class="warn"><h2>${a.take}</h2><p>${a.takep}</p><p><b>${a.prec}</b></p><p class="source"><b>${a.src}:</b> CDC/NIOSH · Take-Home Exposures</p></section><h2>${a.docs}</h2><section class="e links"><p>${a.docp}</p>${links.map(x=>`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join('')}</section>`}function setL(l,b){document.documentElement.lang=l;document.querySelectorAll('.lang button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(l)}render('es');</script></body></html>
