<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyRA Operario</title><link rel="stylesheet" href="styles.css"><style>body{background:#f2f6f7}.app{max-width:760px;margin:auto;padding:15px}.head{background:linear-gradient(135deg,#123f61,#087f92);color:white;padding:20px;border-radius:18px}.head img{width:55px;background:#fff;border-radius:50%;padding:4px;float:right}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tabs button{padding:14px;border:0;border-radius:10px;font-weight:800;background:#dce9eb;color:#123f61}.tabs .on{background:#087f92;color:#fff}.form{background:#fff;border:1px solid #d0dfe3;border-radius:15px;padding:17px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:800;color:#123f61;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aebfc5;border-radius:9px;font-size:16px}.field textarea{min-height:85px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #cadadd;padding:10px;border-radius:9px}.save{width:100%;padding:15px;border:0;border-radius:11px;background:#087f92;color:#fff;font-size:17px;font-weight:800}.note{background:#fff6d8;border-left:5px solid #d39200;padding:12px;border-radius:8px;margin:12px 0}.hidden{display:none}@media(max-width:560px){.row,.checks{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="head"><img src="logosolo.png"><b>SyRA · OPERARIO</b><h1>Registro de visita</h1><p>Completar en el establecimiento desde el celular.</p></section><div class="tabs"><button id="bd" class="on" onclick="tab('d')">1ª VISITA · DIAGNÓSTICO</button><button id="bm" onclick="tab('m')">MONITOREO</button></div><form class="form" id="f" onsubmit="guardar(event)"><div class="row"><div class="field"><label>Cliente activo *</label><select required><option value="">Seleccionar…</option><option>Cliente demostrativo</option></select></div><div class="field"><label>Establecimiento / sucursal *</label><input required placeholder="Nombre o sede"></div></div><div class="row"><div class="field"><label>Fecha *</label><input type="date" required></div><div class="field"><label>Operario *</label><input required placeholder="Nombre y apellido"></div></div><section id="diag"><div class="note"><b>DIAGNÓSTICO INICIAL.</b> Es obligatorio para un cliente que comienza. Esta información define el plan de gestión.</div><div class="field"><label>Actividad del establecimiento *</label><input required placeholder="Ej.: distribuidora, restaurante, industria"></div><div class="field"><label>Sectores inspeccionados *</label><textarea required placeholder="Depósito, elaboración, comedor, sanitarios, exterior…"></textarea></div><div class="field"><label>Plagas / vectores observados o antecedentes</label><div class="checks"><label class="check"><input type="checkbox"> Roedores</label><label class="check"><input type="checkbox"> Cucarachas</label><label class="check"><input type="checkbox"> Moscas</label><label class="check"><input type="checkbox"> Hormigas</label><label class="check"><input type="checkbox"> Avispas</label><label class="check"><input type="checkbox"> Chinches</label><label class="check"><input type="checkbox"> Otro</label></div></div><div class="field"><label>Condiciones predisponentes / vulnerabilidades</label><textarea placeholder="Accesos, grietas, residuos, agua, alimento, orden, almacenamiento…"></textarea></div><div class="field"><label>Hallazgos y evidencia</label><textarea placeholder="Heces, insectos, daños, huellas, capturas, etc."></textarea></div><div class="field"><label>Fotografías</label><input type="file" accept="image/*" capture="environment" multiple></div><div class="field"><label>Dispositivos propuestos</label><textarea placeholder="Cantidad, tipo, código y ubicación propuesta"></textarea></div><div class="field"><label>Recomendaciones iniciales</label><textarea></textarea></div><div class="field"><label>¿Se requiere plano inicial?</label><select><option>Sí</option><option>No</option></select></div></section><section id="mon" class="hidden"><div class="note"><b>MONITOREO.</b> Registrar cada dispositivo revisado y cualquier intervención realizada.</div><div class="row"><div class="field"><label>Código dispositivo *</label><input placeholder="CB-01 / TR-01 / UV-01"></div><div class="field"><label>Tipo *</label><select><option>Cebadera</option><option>Trampa mecánica</option><option>Trampa adhesiva</option><option>Equipo UV</option><option>Otro</option></select></div></div><div class="row"><div class="field"><label>Sector / ubicación *</label><input></div><div class="field"><label>Estado *</label><select><option>Operativo</option><option>Requiere mantenimiento</option><option>Dañado</option><option>Faltante</option></select></div></div><div class="field"><label>Actividad / hallazgo</label><select><option>Sin actividad</option><option>Baja</option><option>Media</option><option>Alta</option><option>Captura</option><option>Indicios</option></select></div><div class="field"><label>Detalle del hallazgo</label><textarea></textarea></div><div class="field"><label>Fotografía del dispositivo / evidencia</label><input type="file" accept="image/*" capture="environment" multiple></div><div class="field"><label>Acción realizada</label><textarea placeholder="Reposición, limpieza, cambio, captura, tratamiento, exclusión…"></textarea></div><div class="row"><div class="field"><label>Producto / método</label><input></div><div class="field"><label>Cantidad / dosis / unidad</label><input></div></div><div class="field"><label>Recomendación / acción correctiva</label><textarea></textarea></div><div class="field"><label>¿Cambió el plano?</label><select id="plano"><option>No · conservar plano vigente</option><option>Sí · alta de dispositivo</option><option>Sí · baja de dispositivo</option><option>Sí · reubicación</option></select></div></section><div class="field"><label>Observaciones generales</label><textarea></textarea></div><button class="save">GUARDAR VISITA</button><p id="msg"></p></form></main><script>function tab(x){document.getElementById('diag').classList.toggle('hidden',x!='d');document.getElementById('mon').classList.toggle('hidden',x!='m');bd.classList.toggle('on',x=='d');bm.classList.toggle('on',x=='m')}function guardar(e){e.preventDefault();document.getElementById('msg').innerHTML='<b>✓ Formulario validado.</b> La interfaz está lista; falta conectar el guardado con la base/Drive para persistir los datos.'}</script></body></html>
