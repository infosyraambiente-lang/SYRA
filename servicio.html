<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyRA · Servicios y órdenes de trabajo</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand.css"><style>body{background:#f3f7f8}.app{max-width:1050px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#123f61,#087f92);color:#fff;border-radius:18px;padding:22px}.hero img{width:58px;background:#fff;border-radius:50%;padding:4px;float:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #cfdee2;border-radius:14px;padding:16px}.field{margin:9px 0}.field label{display:block;font-weight:800;color:#123f61;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #aebfc5;border-radius:9px}.btn{border:0;border-radius:9px;padding:12px 15px;background:#087f92;color:#fff;font-weight:800;cursor:pointer;margin:4px}.btn.dark{background:#123f61}.flow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.flow span{background:#e5f2f1;padding:7px 10px;border-radius:15px;font-size:12px;font-weight:800}.record{border-top:1px solid #dbe5e7;padding:12px 0}.ok{background:#eaf7ef;border-left:5px solid #27834d;padding:11px;border-radius:8px}.warn{background:#fff6d8;border-left:5px solid #d39200;padding:11px;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="hero"><img src="logosolo.png"><b>SyRA · GESTIÓN DE SERVICIOS</b><h1>Presupuesto → Orden → Trabajo → Informe</h1><p>Cada servicio cobrado genera un registro trazable y un historial documental.</p></section><div class="grid"><section class="card"><h2>Crear orden de trabajo</h2><div class="field"><label>Cliente *</label><input id="cliente" required></div><div class="field"><label>Establecimiento *</label><input id="sede" required></div><div class="field"><label>Servicio *</label><select id="tipo"><option>Programa de monitoreo y control</option><option>Control de roedores</option><option>Control de insectos rastreros</option><option>Control de insectos voladores</option><option>Diagnóstico / relevamiento</option><option>Remediación ambiental</option><option>Otro</option></select></div><div class="field"><label>Fecha prevista</label><input id="fecha" type="date"></div><div class="field"><label>Precio acordado</label><input id="precio" type="number" min="0" step="0.01" placeholder="0"></div><button class="btn" onclick="crear()">CREAR ORDEN</button></section><section class="card"><h2>Costos internos</h2><p>Estos datos son internos y no se muestran al cliente.</p><div class="field"><label>Valor hora profesional</label><input id="vh" type="number" min="0" step="0.01"></div><div class="field"><label>Valor hora operario</label><input id="vo" type="number" min="0" step="0.01"></div><div class="field"><label>Consumo gasoil (L/km)</label><input id="consumo" type="number" min="0" step="0.001" placeholder="Ej. 0.12"></div><div class="field"><label>Precio gasoil por litro</label><input id="comb" type="number" min="0" step="0.01"></div><div class="field"><label>Costos/materiales adicionales</label><input id="extra" type="number" min="0" step="0.01"></div><button class="btn dark" onclick="guardarConfig()">GUARDAR COSTOS INTERNOS</button></section></div><section class="card" style="margin-top:14px"><h2>Servicios registrados</h2><div id="lista"></div></section></main><script>const $=id=>document.getElementById(id);fecha.value=new Date().toISOString().slice(0,10);const cfg=JSON.parse(localStorage.getItem('syra_costos')||'{}');['vh','vo','consumo','comb','extra'].forEach(k=>{if(cfg[k]!=null)$(k).value=cfg[k]});function guardarConfig(){const c={vh:+$('vh').value||0,vo:+$('vo').value||0,consumo:+$('consumo').value||0,comb:+$('comb').value||0,extra:+$('extra').value||0};localStorage.setItem('syra_costos',JSON.stringify(c));alert('Costos internos guardados.');}function crear(){if(!$('cliente').value||!$('sede').value)return alert('Completá cliente y establecimiento.');const a=JSON.parse(localStorage.getItem('syra_servicios')||'[]');const n={id:'OT-'+Date.now(),cliente:$('cliente').value,sede:$('sede').value,tipo:$('tipo').value,fecha:$('fecha').value,precio:+$('precio').value||0,estado:'Pendiente',creado:new Date().toISOString(),inicio:null,fin:null,km:0,horas:0,visitas:[],informe:null};a.push(n);localStorage.setItem('syra_servicios',JSON.stringify(a));$('cliente').value='';$('sede').value='';$('precio').value='';render();}function cerrar(id){const a=JSON.parse(localStorage.getItem('syra_servicios')||'[]');const x=a.find(s=>s.id===id);if(!x)return;x.estado='Cerrado';x.informe={generado:new Date().toISOString(),servicio:x.tipo,cliente:x.cliente,establecimiento:x.sede,precio:x.precio,visitas:x.visitas.length,km:x.km,horas:x.horas};localStorage.setItem('syra_servicios',JSON.stringify(a));render();}function render(){const a=JSON.parse(localStorage.getItem('syra_servicios')||'[]').slice().reverse();$('lista').innerHTML=a.length?a.map(x=>`<div class="record"><b>${x.id} · ${x.cliente}</b><br>${x.sede} · ${x.tipo}<div class="flow"><span>${x.estado}</span><span>Precio: $${x.precio.toLocaleString('es-AR')}</span><span>${x.visitas.length} visitas</span><span>${x.km||0} km</span></div>${x.estado!=='Cerrado'?`<button class="btn" onclick="cerrar('${x.id}')">CERRAR Y GENERAR REGISTRO</button>`:'<div class="ok">✓ Registro final e informe preparados.</div>'}</div>`).join(''):'Todavía no hay órdenes de trabajo.'}render();</script></body></html>
